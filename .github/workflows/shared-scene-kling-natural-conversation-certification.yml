name: Shared Scene Kling Natural Conversation Certification

on:
  push:
    branches:
      - feature/dev-shared-scene-kling-natural-conversation-20261003
      - fix/dev-group-conversation-20pct-video-pricing-20261003
  pull_request:
    branches:
      - fix/next3-shared-scene-profile-lock-fix-20260928
    paths:
      - 'services/svc-director/app/app/fusion_input_performance.py'
      - 'services/svc-director/app/app/fusion_execution_parent_pricing.py'
      - 'services/svc-director/tests/test_shared_scene_contract.py'
      - 'services/svc-fusion-extension/app/app/api/routes/v3_scene_pricing.py'
      - 'services/svc-fusion-extension/tests/test_v3_scene_pricing_kling_shared.py'
      - 'scripts/test-shared-scene-kling-natural-conversation.py'
      - 'migrations/2026_10_03_group_conversation_premium_actual_seconds.sql'
      - '.github/workflows/shared-scene-kling-natural-conversation-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout backend candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python compile gate
        run: |
          python -m py_compile services/svc-director/app/app/fusion_input_performance.py
          python -m py_compile services/svc-director/app/app/fusion_execution_parent_pricing.py
          python -m py_compile services/svc-fusion-extension/app/app/api/routes/v3_scene_pricing.py

      - name: Natural conversation and pricing source contract
        run: python scripts/test-shared-scene-kling-natural-conversation.py

      - name: Focused static tests
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path("services/svc-fusion-extension/tests/test_v3_scene_pricing_kling_shared.py")
          tests = [value for name, value in ns.items() if name.startswith("test_") and callable(value)]
          assert tests, "no focused tests discovered"
          for test in tests:
              test()
          print("KLING_SHARED_SCENE_FOCUSED_TESTS=PASS")
          PY

      - name: Mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git merge-base origin/fix/next3-shared-scene-profile-lock-fix-20260928 HEAD)"
          git diff --name-only "$BASE"...HEAD | tee /tmp/changed.txt
          grep -Ev '^(services/svc-fusion-extension/app/app/api/routes/v3_scene_pricing.py|services/svc-fusion-extension/tests/test_v3_scene_pricing_kling_shared.py|scripts/test-shared-scene-kling-natural-conversation.py|migrations/2026_10_03_group_conversation_premium_actual_seconds.sql|.github/workflows/shared-scene-kling-natural-conversation-certification.yml)$' /tmp/changed.txt > /tmp/unexpected.txt || true
          test ! -s /tmp/unexpected.txt
          echo DATABASE_MIGRATION=SCOPED_GROUP_PRICING_ONLY
          echo GROUP_CONVERSATION_PREMIUM_20PCT_PRICING=PASS
          echo NON_SHARED_PRICING_UNCHANGED=PASS
          echo PRODUCTION_TOUCH=NONE
