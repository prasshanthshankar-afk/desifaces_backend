name: Shared Scene Kling Natural Conversation Certification

on:
  push:
    branches:
      - feature/dev-shared-scene-kling-natural-conversation-20261003
  pull_request:
    branches:
      - fix/next3-shared-scene-profile-lock-fix-20260928
    paths:
      - 'services/svc-director/app/app/fusion_input_performance.py'
      - 'services/svc-director/app/app/fusion_execution_parent_pricing.py'
      - 'services/svc-director/tests/test_shared_scene_contract.py'
      - 'services/svc-fusion-extension/app/app/api/routes/v3_scene_pricing.py'
      - 'services/svc-fusion-extension/tests/test_v3_scene_pricing_kling_shared.py'
      - 'scripts/test-shared-scene-kling-natural-conversation.py'
      - '.github/workflows/shared-scene-kling-natural-conversation-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout backend candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python compile gate
        run: |
          python -m py_compile services/svc-director/app/app/fusion_input_performance.py
          python -m py_compile services/svc-director/app/app/fusion_execution_parent_pricing.py
          python -m py_compile services/svc-fusion-extension/app/app/api/routes/v3_scene_pricing.py

      - name: Natural conversation source contract
        run: python scripts/test-shared-scene-kling-natural-conversation.py

      - name: Focused static tests
        run: |
          python -m pytest -q \
            services/svc-fusion-extension/tests/test_v3_scene_pricing_kling_shared.py

      - name: Mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git merge-base origin/fix/next3-shared-scene-profile-lock-fix-20260928 HEAD)"
          git diff --name-only "$BASE"...HEAD | tee /tmp/changed.txt
          grep -Ev '^(services/svc-director/app/app/fusion_input_performance.py|services/svc-director/app/app/fusion_execution_parent_pricing.py|services/svc-director/tests/test_shared_scene_contract.py|services/svc-fusion-extension/app/app/api/routes/v3_scene_pricing.py|services/svc-fusion-extension/tests/test_v3_scene_pricing_kling_shared.py|scripts/test-shared-scene-kling-natural-conversation.py|.github/workflows/shared-scene-kling-natural-conversation-certification.yml)$' /tmp/changed.txt > /tmp/unexpected.txt || true
          test ! -s /tmp/unexpected.txt
          echo DATABASE_MIGRATION=NONE
          echo EXISTING_PREMIUM_PRICING_REUSED=PASS
          echo PRODUCTION_TOUCH=NONE
          echo SHARED_SCENE_KLING_NATURAL_CONVERSATION=PASS
