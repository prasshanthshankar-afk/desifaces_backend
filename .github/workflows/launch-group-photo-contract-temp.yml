name: launch-group-photo-contract-temp

on:
  push:
    branches:
      - fix/launch-group-photo-video-2-person-20261001

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile changed Director modules
        run: |
          python -m py_compile             services/svc-director/app/app/shared_scene_state_routes.py             services/svc-director/app/app/shared_scene_routes.py             services/svc-director/app/app/fusion_execution.py             services/svc-director/tests/test_shared_scene_state_contract.py             services/svc-director/tests/test_shared_scene_contract.py
      - name: Run dependency-free shared-scene state contract
        run: |
          python - <<'PY'
          from pathlib import Path
          state = Path("services/svc-director/app/app/shared_scene_state_routes.py").read_text()
          routes = Path("services/svc-director/app/app/shared_scene_routes.py").read_text()
          fusion = Path("services/svc-director/app/app/fusion_execution.py").read_text()
          assert '"generate_supported": len(speakers) >= 2' in state
          assert '"participant_count": len(speakers)' in state
          assert '"supported": video_supported' in state
          assert '"max_people": 2' in state
          assert '"video_unavailable_for_group_size"' in state
          assert "shared_scene_video_requires_exactly_two_speakers" in routes
          assert "len(speaker_targets) != 2" in routes
          assert "shared_scene_video_requires_exactly_two_speakers" in fusion
          assert "len(shared_speaker_ids) != 2" in fusion
          print("LAUNCH_GROUP_PHOTO_CONTRACT=PASS")
          PY
