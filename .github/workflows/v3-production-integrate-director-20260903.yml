name: V3 Production Integrate Director Runtime

on:
  push:
    branches:
      - release/v3-production-launch-20260903
    paths:
      - '.github/workflows/v3-production-integrate-director-20260903.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-certify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production release branch
        uses: actions/checkout@v4
        with:
          ref: release/v3-production-launch-20260903
          fetch-depth: 0

      - name: Merge Director lineage and resolve exact audited conflicts
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'desifaces-release-bot'
          git config user.email 'release@desifaces.ai'
          git fetch origin feature/v3-assistant-operational-20260830

          set +e
          git merge --no-commit --no-ff origin/feature/v3-assistant-operational-20260830
          rc=$?
          set -e
          [[ "$rc" -eq 1 ]] || { echo "FAIL: expected audited merge conflicts rc=1, got rc=$rc"; exit 1; }

          cat > /tmp/expected-conflicts.txt <<'EOF'
          .github/workflows/v3-contract-tests.yml
          migrations/2026_08_30_multi_person_premium_pricing.sql
          scripts/v3-compose.sh
          services/shared/python/desifaces_shared/pricing/multi_person.py
          services/svc-face/app/app/main.py
          services/svc-face/app/app/services/multi_person_pricing_policy.py
          services/svc-fusion-extension/app/app/workers/stitch_worker.py
          services/svc-fusion/app/app/workers/fusion_worker.py
          EOF
          git diff --name-only --diff-filter=U | sort > /tmp/actual-conflicts.txt
          diff -u /tmp/expected-conflicts.txt /tmp/actual-conflicts.txt
          echo 'DIRECTOR_CONFLICT_SET=PASS'

          # September launch behavior remains authoritative for pricing, Face startup,
          # the current Fusion worker and the consolidated contract-test workflow.
          git checkout --ours -- \
            .github/workflows/v3-contract-tests.yml \
            migrations/2026_08_30_multi_person_premium_pricing.sql \
            services/shared/python/desifaces_shared/pricing/multi_person.py \
            services/svc-face/app/app/main.py \
            services/svc-face/app/app/services/multi_person_pricing_policy.py \
            services/svc-fusion/app/app/workers/fusion_worker.py
          git add \
            .github/workflows/v3-contract-tests.yml \
            migrations/2026_08_30_multi_person_premium_pricing.sql \
            services/shared/python/desifaces_shared/pricing/multi_person.py \
            services/svc-face/app/app/main.py \
            services/svc-face/app/app/services/multi_person_pricing_policy.py \
            services/svc-fusion/app/app/workers/fusion_worker.py

          # Keep both the secure external-env worktree bridge and the canonical V3
          # Fusion storage-container guard.
          git checkout --ours -- scripts/v3-compose.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/v3-compose.sh')
          s = p.read_text()
          anchor = '''###############################################################################\n# Disallow the two most dangerous destructive forms.\n###############################################################################\n'''
          if anchor not in s:
              raise SystemExit('v3-compose destructive-safety anchor missing')
          marker = '# Pin V3 Fusion final media to one explicit storage-container contract.'
          if marker not in s:
              block = '''###############################################################################\n# Pin V3 Fusion final media to one explicit storage-container contract.\n#\n# V3 provider artifacts and stitched output use one canonical video container\n# unless an explicit V3-only override is supplied.\n###############################################################################\n\nDF_V3_FUSION_OUTPUT_CONTAINER="${DF_V3_FUSION_OUTPUT_CONTAINER:-video-output}"\ncontainer_len=${#DF_V3_FUSION_OUTPUT_CONTAINER}\nif (( container_len < 3 || container_len > 63 )) \\\n  || [[ ! "$DF_V3_FUSION_OUTPUT_CONTAINER" =~ ^[a-z0-9][a-z0-9-]*[a-z0-9]$ ]] \\\n  || [[ "$DF_V3_FUSION_OUTPUT_CONTAINER" == *--* ]]; then\n  die "invalid DF_V3_FUSION_OUTPUT_CONTAINER: $DF_V3_FUSION_OUTPUT_CONTAINER"\nfi\n\nexport DF_V3_FUSION_OUTPUT_CONTAINER\nexport AZURE_FINAL_VIDEO_CONTAINER="$DF_V3_FUSION_OUTPUT_CONTAINER"\nexport AZURE_VIDEO_OUTPUT_CONTAINER="$DF_V3_FUSION_OUTPUT_CONTAINER"\n\n\n'''
              s = s.replace(anchor, block + anchor, 1)
          p.write_text(s)
          PY
          git add scripts/v3-compose.sh

          # Preserve the current concurrent canonical longform stitcher and add the
          # V3 Story scene reconciler as a side-by-side loop.
          git checkout --ours -- services/svc-fusion-extension/app/app/workers/stitch_worker.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('services/svc-fusion-extension/app/app/workers/stitch_worker.py')
          s = p.read_text()
          imp = 'from app.workers.v3_scene_coordinator import v3_scene_coordinator_loop\n'
          if imp not in s:
              anchor = 'from app.services.longform_orchestrator import stitch_if_ready\n'
              if anchor not in s:
                  raise SystemExit('stitch_worker import anchor missing')
              s = s.replace(anchor, anchor + imp, 1)
          old = '''\n\nif __name__ == "__main__":\n    asyncio.run(stitch_loop())\n'''
          new = '''\n\nasync def main() -> None:\n    """Run canonical longform stitching and V3 Story reconciliation together."""\n    await asyncio.gather(\n        stitch_loop(),\n        v3_scene_coordinator_loop(),\n    )\n\n\nif __name__ == "__main__":\n    asyncio.run(main())\n'''
          if 'v3_scene_coordinator_loop()' not in s:
              if old not in s:
                  raise SystemExit('stitch_worker main anchor missing')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git add services/svc-fusion-extension/app/app/workers/stitch_worker.py

          unresolved="$(git diff --name-only --diff-filter=U)"
          [[ -z "$unresolved" ]] || { echo "FAIL: unresolved conflicts"; echo "$unresolved"; exit 1; }
          git diff --cached --check
          grep -Fq 'DF_V3_FUSION_OUTPUT_CONTAINER' scripts/v3-compose.sh
          grep -Fq 'SERVICE_ENV_LINK_OWNED' scripts/v3-compose.sh
          grep -Fq 'v3_scene_coordinator_loop' services/svc-fusion-extension/app/app/workers/stitch_worker.py
          grep -Fq 'claim_next_jobs' services/svc-fusion/app/app/workers/fusion_worker.py
          echo 'DIRECTOR_MERGE_RESOLUTION=PASS'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused Director test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pip install --disable-pip-version-check -q -r services/svc-director/app/requirements.txt

      - name: Compile integrated V3 runtime
        run: |
          bash -n scripts/v3-compose.sh
          python -m compileall -q \
            services/shared/df_contracts \
            services/shared/python/desifaces_shared/pricing \
            services/shared/python/desifaces_shared/v3 \
            services/svc-director/app \
            services/svc-face/app/app \
            services/svc-audio/app/app \
            services/svc-fusion/app/app \
            services/svc-fusion-extension/app/app \
            services/svc-dashboard/app/app
          echo 'DIRECTOR_INTEGRATED_COMPILE=PASS'

      - name: Run Director and Story foundation tests
        env:
          PYTHONPATH: .:services/shared:services/shared/python:services/svc-director/app
        run: |
          python -m pytest -q \
            test/test_v3_multiperson_story_foundation.py \
            test/test_v3_creative_director_foundation.py \
            test/test_v3_participant_ref_normalization.py \
            test/test_v3_studio_hitl_workflow.py \
            test/test_v3_participant_face_bridge.py \
            test/test_v3_face_execution_policy.py \
            test/test_v3_face_audio_hotfix.py
          echo 'DIRECTOR_STORY_TESTS=PASS'

      - name: Guard September launch behavior
        run: |
          grep -Fq 'if self.studio in {"face", "fusion"}' services/shared/python/desifaces_shared/pricing/multi_person.py
          grep -Fq 'claim_next_jobs' services/svc-fusion/app/app/workers/fusion_worker.py
          grep -Fq 'stitch_if_ready' services/svc-fusion-extension/app/app/workers/stitch_worker.py
          grep -Fq 'v3_scene_coordinator_loop' services/svc-fusion-extension/app/app/workers/stitch_worker.py
          echo 'SEPTEMBER_LAUNCH_BEHAVIOR_GUARD=PASS'

      - name: Commit integrated Director runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          git status --short
          git diff --cached --check
          git commit -m 'release(v3): integrate Director and Story runtime for production'
          git push origin HEAD:release/v3-production-launch-20260903
          echo "DIRECTOR_RELEASE_SHA=$(git rev-parse HEAD)"
