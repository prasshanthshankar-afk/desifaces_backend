name: subtitles-certification

on:
  pull_request:
    paths:
      - "services/svc-fusion-extension/**"
      - "docs/video-subtitles.md"
      - "scripts/ops/deploy-subtitles-dev.sh"
      - ".github/workflows/subtitles-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-subtitles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Fusion Extension
        run: python -m compileall -q services/svc-fusion-extension/app/app

      - name: Install focused subtitle test dependencies
        run: |
          python -m pip install --disable-pip-version-check             pytest             pydantic             pydantic-settings             azure-storage-blob

      - name: Subtitle unit tests
        env:
          PYTHONPATH: services/svc-fusion-extension/app
          DATABASE_URL: postgresql://unused:unused@localhost/unused
          JWT_SECRET: subtitle-certification-only
          AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=https;AccountName=unused;AccountKey=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=;EndpointSuffix=core.windows.net
        run: |
          python -m pytest -q services/svc-fusion-extension/tests/test_subtitle_service.py

      - name: Naming policy
        run: |
          test -f services/svc-fusion-extension/app/app/services/subtitle_service.py
          test -f docs/video-subtitles.md
          test -f scripts/ops/deploy-subtitles-dev.sh
          ! find services/svc-fusion-extension docs scripts/ops -type f             \( -iname '*subtitle*v[0-9]*' -o -iname '*v[0-9]*subtitle*' \)             -print -quit | grep -q .
          echo SUBTITLE_NAMING_POLICY=PASS
