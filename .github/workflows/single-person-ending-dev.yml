name: Single-person ending DEV certification

on:
  push:
    branches: [codex/single-person-ending-dev-20261010]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Speech preservation, closing pause, billing and isolation tests
        run: |
          python services/svc-fusion-extension/tests/test_talking_video_finish.py
          python services/svc-fusion-extension/tests/test_talking_video_full_audio_plan.py
      - name: Debian FFmpeg 7 runtime compatibility
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" -w /work python:3.11-slim bash -ec '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ffmpeg
            ffmpeg -version | head -n 1
            timeout 60s python services/svc-fusion-extension/tests/test_talking_video_finish.py
            python services/svc-fusion-extension/tests/test_talking_video_full_audio_plan.py
          '
      - name: Compile modified service modules
        run: python -m py_compile services/svc-fusion-extension/app/app/services/talking_video_finish.py services/svc-fusion-extension/app/app/services/longform_orchestrator.py
      - name: DEV and PROD deployment contracts
        run: |
          bash -n scripts/ops/deploy-single-person-ending-dev.sh
          bash -n scripts/ops/deploy-single-person-ending-prod.sh
          python -m py_compile scripts/ops/verify-talking-video-completeness.py
          python services/svc-fusion-extension/tests/test_ending_deploy_contract.py
