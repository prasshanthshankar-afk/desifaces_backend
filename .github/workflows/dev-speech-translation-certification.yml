name: DEV Speech Translation Certification

on:
  workflow_dispatch:
  push:
    branches:
      - feature/dev-sarvam-contextual-video-qc-20261013
    paths:
      - 'services/shared/llm/dev_*'
      - 'services/svc-audio/app/app/repos/translation_capability_repo.py'
      - 'tests/test_dev_*'
      - 'migrations/2026_10_17_dev_audio_translation_capabilities.sql'
      - 'services/svc-audio/app/app/services/dev_provider_translation.py'
      - 'services/svc-audio/app/app/services/dev_contextual_translation_gate.py'
      - 'services/svc-audio/app/app/services/tts_service.py'
      - 'services/svc-audio/app/app/services/tts_orchestrator.py'
      - '.github/workflows/dev-speech-translation-certification.yml'

permissions:
  contents: read

jobs:
  translation-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install isolated test dependencies
        run: |
          python -m pip install \
            'pytest>=8,<9' \
            'pytest-asyncio>=0.24,<1' \
            'httpx>=0.27,<1'

      - name: Run DEV translation contract tests
        run: |
          python -m pytest -q \
            tests/test_dev_sarvam_mayura_translation.py \
            tests/test_dev_translation_selection.py \
            tests/test_dev_translation_capability_repo.py \
            tests/test_dev_provider_translation_integration.py \
            tests/test_dev_provider_translation_locale_resolution.py \
            tests/test_dev_contextual_translation_gate.py

      - name: Assert retired migration cannot create tables
        run: |
          python - <<'PY'
          from pathlib import Path
          content = Path("migrations/2026_10_17_dev_audio_translation_capabilities.sql").read_text()
          executable = "\\n".join(line for line in content.splitlines() if not line.lstrip().startswith("--"))
          assert "CREATE TABLE" not in executable.upper()
          assert "ALTER TABLE" not in executable.upper()
          assert "INSERT INTO" not in executable.upper()
          print("SCHEMA_MIGRATION=NO_OP")
          PY

      - name: Verify no production deployment
        run: |
          echo "CERTIFICATION_SCOPE=OFFLINE_ONLY"
          echo "DEV_DEPLOYMENT=NOT_PERFORMED"
          echo "PRODUCTION_DEPLOYMENT=NOT_PERFORMED"
