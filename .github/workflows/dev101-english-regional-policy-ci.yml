name: DEV101 English Regional Policy Certification

on:
  pull_request:
    branches:
      - release/dev101-certified-20261123
    paths:
      - 'services/shared/python/desifaces_shared/v3/english_source_policy.py'
      - 'services/shared/python/desifaces_shared/v3/director_graph.py'
      - 'services/svc-director/app/app/experience_compiler.py'
      - 'test/test_dev101_english_regional_policy.py'
      - '.github/workflows/dev101-english-regional-policy-ci.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed code
        run: |
          python -m py_compile \
            services/shared/python/desifaces_shared/v3/english_source_policy.py \
            services/shared/python/desifaces_shared/v3/director_graph.py \
            services/svc-director/app/app/experience_compiler.py
      - name: Regression checks — English regional locales and approved routes
        run: |
          python -m pip install pytest
          PYTHONPATH=services/shared/python python -m pytest -q test/test_dev101_english_regional_policy.py
