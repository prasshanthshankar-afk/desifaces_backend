name: V3 Canonical Contract Tests

on:
  push:
    branches:
      - desifaces-v3
      - "feature/v3-*"
    paths:
      - "services/shared/df_contracts/**"
      - "services/shared/python/desifaces_shared/identity/**"
      - "services/shared/python/desifaces_shared/v3/**"
      - "services/svc-face/app/**"
      - "services/svc-audio/app/**"
      - "services/svc-fusion/app/**"
      - "services/svc-pricing/app/**"
      - "services/svc-director/app/**"
      - "migrations/2026_08_18_v3_*.sql"
      - "test/test_v3_*.py"
      - "scripts/v3-c3-authenticated-adapter-certify.sh"
      - "scripts/v3-c4-c6-certify.sh"
      - "scripts/v3-c45-runtime-certify.py"
      - "scripts/v3-multiperson-story-certify.sh"
      - "scripts/v3-multiperson-story-runtime-certify.py"
      - "scripts/v3-mps-functional-test.sh"
      - "docker-compose.v3.yml"
      - ".github/workflows/v3-contract-tests.yml"
  pull_request:
    branches:
      - desifaces-v3
    paths:
      - "services/shared/df_contracts/**"
      - "services/shared/python/desifaces_shared/identity/**"
      - "services/shared/python/desifaces_shared/v3/**"
      - "services/svc-face/app/**"
      - "services/svc-audio/app/**"
      - "services/svc-fusion/app/**"
      - "services/svc-pricing/app/**"
      - "services/svc-director/app/**"
      - "migrations/2026_08_18_v3_*.sql"
      - "test/test_v3_*.py"
      - "scripts/v3-c3-authenticated-adapter-certify.sh"
      - "scripts/v3-c4-c6-certify.sh"
      - "scripts/v3-c45-runtime-certify.py"
      - "scripts/v3-multiperson-story-certify.sh"
      - "scripts/v3-multiperson-story-runtime-certify.py"
      - "scripts/v3-mps-functional-test.sh"
      - "docker-compose.v3.yml"
      - ".github/workflows/v3-contract-tests.yml"

permissions:
  contents: read

jobs:
  canonical-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest "pydantic>=2,<3" langgraph==1.2.9

      - name: Compile V3 contract and compatibility code
        run: |
          python -m compileall -q \
            services/shared/df_contracts \
            services/shared/python/desifaces_shared/identity \
            services/shared/python/desifaces_shared/v3 \
            services/svc-face/app/app/services/v3_face_adapter_shadow.py \
            services/svc-face/app/app/api/v3_adapter_probe.py \
            services/svc-audio/app/app/services/v3_audio_adapter_shadow.py \
            services/svc-audio/app/app/api/v3_adapter_probe.py \
            services/svc-fusion/app/app/services/v3_fusion_adapter_shadow.py \
            services/svc-fusion/app/app/api/v3_adapter_probe.py \
            services/svc-pricing/app/app/services/v3_pricing_adapter_shadow.py \
            services/svc-pricing/app/app/api/v3_adapter_probe.py \
            services/svc-pricing/app/app/services/subscription_credit_integrity_service.py \
            services/svc-pricing/app/app/services/subscription_reconciler_loop.py \
            services/svc-pricing/app/app/tools/v3_c6_certify.py \
            services/svc-director/app/app \
            scripts/v3-c45-runtime-certify.py \
            scripts/v3-multiperson-story-runtime-certify.py

      - name: Validate certification shell syntax
        run: |
          bash -n scripts/v3-c3-authenticated-adapter-certify.sh
          bash -n scripts/v3-c4-c6-certify.sh
          bash -n scripts/v3-multiperson-story-certify.sh
          bash -n scripts/v3-mps-functional-test.sh

      - name: Run canonical foundation unit tests
        env:
          PYTHONPATH: .:services/shared:services/shared/python
        run: |
          python -m pytest -q \
            test/test_v3_adapter_primitives.py \
            test/test_v3_face_adapter.py \
            test/test_v3_audio_adapter.py \
            test/test_v3_fusion_adapter.py \
            test/test_v3_pricing_adapter.py \
            test/test_v3_account_context.py \
            test/test_v3_media_generation_foundation.py \
            test/test_v3_subscription_cycle.py \
            test/test_v3_multiperson_story_foundation.py \
            test/test_v3_creative_director_foundation.py \
            test/test_v3_participant_ref_normalization.py
