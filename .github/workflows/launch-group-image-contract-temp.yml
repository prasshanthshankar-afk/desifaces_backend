name: launch-group-image-contract-temp

on:
  push:
    branches:
      - fix/launch-group-photo-video-2-person-20261001

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            services/svc-director/app/app/shared_scene_state_routes.py \
            services/svc-director/app/app/shared_scene_routes.py \
            services/svc-director/app/app/fusion_execution.py \
            services/svc-face/app/app/services/creator_prompt_service.py \
            services/svc-face/app/app/services/creator_orchestrator.py

      - name: Build svc-face test image
        run: docker build -t desifaces-face-launch-test -f services/svc-face/app/Dockerfile .

      - name: Run focused image prompt regression contracts
        run: |
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            desifaces-face-launch-test \
            python - <<'PY'
          import runpy

          ns = runpy.run_path("/workspace/services/svc-face/tests/test_creator_prompt_quality_integration.py")
          tests = [
              "test_india_i2i_preserves_source_demographics_and_identity",
              "test_multi_person_t2i_preserves_full_group_without_single_person_default",
              "test_multi_person_i2i_preserves_every_person_and_identity",
              "test_multi_person_i2i_strict_identity_lock_is_plural_aware",
          ]
          for name in tests:
              ns[name]()
              print(f"{name}=PASS")
          print("GROUP_IMAGE_T2I_I2I_CONTRACT=PASS")
          PY

      - name: Verify Director group-image/video boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          state = Path("services/svc-director/app/app/shared_scene_state_routes.py").read_text()
          routes = Path("services/svc-director/app/app/shared_scene_routes.py").read_text()
          fusion = Path("services/svc-director/app/app/fusion_execution.py").read_text()
          assert '"generate_supported": len(speakers) >= 2' in state
          assert '"participant_count": len(speakers)' in state
          assert '"max_people": 2' in state
          assert '"video_unavailable_for_group_size"' in state
          assert "len(speaker_targets) != 2" in routes
          assert "len(shared_speaker_ids) != 2" in fusion
          print("GROUP_PHOTO_VIDEO_BOUNDARY=PASS")
          PY
