name: V3 Spending Reporting Certification

on:
  push:
    branches:
      - main
    paths:
      - 'services/svc-pricing/app/app/api/routes/spending.py'
      - 'services/svc-pricing/app/app/services/customer_spending_service.py'
      - 'services/svc-pricing/app/app/main.py'
      - 'scripts/test-v3-spending-reporting.py'
      - 'scripts/launch-v3-production-20260903.sh'
      - 'scripts/launch-v3-production-secure-20260903.sh'
      - '.github/workflows/v3-spending-reporting.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'services/svc-pricing/app/app/api/routes/spending.py'
      - 'services/svc-pricing/app/app/services/customer_spending_service.py'
      - 'services/svc-pricing/app/app/main.py'
      - 'scripts/test-v3-spending-reporting.py'
      - 'scripts/launch-v3-production-20260903.sh'
      - 'scripts/launch-v3-production-secure-20260903.sh'
      - '.github/workflows/v3-spending-reporting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spending-reporting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Spending source integrity gate
        run: python3 scripts/test-v3-spending-reporting.py

      - name: Python syntax gate
        run: >-
          python3 -m py_compile
          services/svc-pricing/app/app/api/routes/spending.py
          services/svc-pricing/app/app/services/customer_spending_service.py

      - name: Production cutover launcher syntax gate
        run: |
          bash -n scripts/launch-v3-production-20260903.sh
          bash -n scripts/launch-v3-production-secure-20260903.sh
          grep -Fq '21267cf8f0a25622ceb83f74e3abb8aea5f11b6a' scripts/launch-v3-production-secure-20260903.sh
          grep -Fq '38ee936c2e4c22697c78d30d54292879ef81c96c' scripts/launch-v3-production-secure-20260903.sh
          echo 'SECURE_CUTOVER_PIN_GATE=PASS'
