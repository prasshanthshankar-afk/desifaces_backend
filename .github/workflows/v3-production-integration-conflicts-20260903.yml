name: V3 Production Integration Conflict Inventory

on:
  push:
    branches:
      - release/v3-production-launch-20260903
    paths:
      - '.github/workflows/v3-production-integration-conflicts-20260903.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production release base
        uses: actions/checkout@v4
        with:
          ref: release/v3-production-launch-20260903
          fetch-depth: 0
      - name: Inventory Director merge conflicts
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'desifaces-release-bot'
          git config user.email 'release@desifaces.ai'
          git fetch origin feature/v3-assistant-operational-20260830
          set +e
          git merge --no-commit --no-ff origin/feature/v3-assistant-operational-20260830
          rc=$?
          set -e
          echo "DIRECTOR_MERGE_RC=$rc"
          echo "DIRECTOR_CONFLICTS_BEGIN"
          git diff --name-only --diff-filter=U | sort
          echo "DIRECTOR_CONFLICTS_END"
          echo "DIRECTOR_CONFLICT_HUNKS_BEGIN"
          git diff --cc -- \
            .github/workflows/v3-contract-tests.yml \
            migrations/2026_08_30_multi_person_premium_pricing.sql \
            scripts/v3-compose.sh \
            services/shared/python/desifaces_shared/pricing/multi_person.py \
            services/svc-face/app/app/main.py \
            services/svc-face/app/app/services/multi_person_pricing_policy.py \
            services/svc-fusion-extension/app/app/workers/stitch_worker.py \
            services/svc-fusion/app/app/workers/fusion_worker.py || true
          echo "DIRECTOR_CONFLICT_HUNKS_END"
          git merge --abort || true
          exit "$rc"
