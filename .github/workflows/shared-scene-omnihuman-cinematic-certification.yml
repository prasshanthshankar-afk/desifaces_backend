name: Shared Scene OmniHuman Cinematic Certification

on:
  push:
    branches:
      - feature/dev-shared-scene-omnihuman-cinematic-20261004
  pull_request:
    paths:
      - 'services/svc-director/app/app/fusion_execution.py'
      - 'services/svc-director/app/app/fusion_input_performance.py'
      - 'services/svc-director/app/app/shared_scene_routes.py'
      - 'services/svc-director/app/app/shared_scene_state_routes.py'
      - 'services/svc-fusion/app/app/services/providers/omnihuman_adapter.py'
      - 'services/svc-fusion/app/app/requirements.txt'
      - 'services/svc-fusion/app/Dockerfile'
      - 'services/svc-fusion-extension/app/app/api/routes/v3_scene_pricing.py'
      - 'services/svc-fusion-extension/app/app/api/routes/v3_scene_stitch.py'
      - 'services/svc-fusion-extension/app/app/services/stitch_service.py'
      - 'services/svc-fusion-extension/app/app/workers/v3_scene_coordinator.py'
      - 'services/svc-director/tests/test_shared_scene_contract.py'
      - 'services/svc-fusion-extension/tests/test_v3_scene_pricing_omnihuman_shared.py'
      - 'scripts/test-shared-scene-omnihuman-cinematic.py'
      - 'scripts/ops/deploy-dev-omnihuman-group-conversation.sh'
      - 'migrations/2026_10_03_group_conversation_premium_actual_seconds.sql'
      - 'migrations/2026_10_04_group_conversation_omnihuman_cogs.sql'
      - 'migrations/2026_10_04_omnihuman_provider_identity.sql'
      - '.github/workflows/shared-scene-omnihuman-cinematic-certification.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout backend candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: DEV deploy script syntax
        run: |
          bash -n scripts/ops/deploy-dev-omnihuman-group-conversation.sh
          grep -Fq 'MANAGED_COMPOSE_OVERLAY_RECOVERY=PASS' scripts/ops/deploy-dev-omnihuman-group-conversation.sh
          grep -Fq '.desifaces-deploy/omnihuman-runtime.yml' scripts/ops/deploy-dev-omnihuman-group-conversation.sh
          grep -Fq '.desifaces-deploy/omnihuman-images.yml' scripts/ops/deploy-dev-omnihuman-group-conversation.sh
          grep -Fq 'recoverable_missing_managed_compose_overlay=' scripts/ops/deploy-dev-omnihuman-group-conversation.sh
          grep -Fq 'OmniHuman model config missing from caller, DEV Fusion API, and DEV Fusion worker' scripts/ops/deploy-dev-omnihuman-group-conversation.sh
          grep -Fq 'for svc in svc-fusion svc-fusion-worker' scripts/ops/deploy-dev-omnihuman-group-conversation.sh
          grep -Fq 'OMNIHUMAN_MODEL_SOURCE=' scripts/ops/deploy-dev-omnihuman-group-conversation.sh
          grep -Fq '{"label": 1, "x": int(active[0]), "y": int(active[1])}' scripts/ops/deploy-dev-omnihuman-group-conversation.sh
          grep -Fq '{"label": 0, "x": int(listener[0]), "y": int(listener[1])}' scripts/ops/deploy-dev-omnihuman-group-conversation.sh
          if grep -Fq 'assert "active, listener" in src' scripts/ops/deploy-dev-omnihuman-group-conversation.sh; then
            echo 'FAIL: stale brittle active-speaker source assertion returned'
            exit 1
          fi
          echo DEV_COMPOSE_OVERLAY_RECOVERY_CONTRACT=PASS
          echo DEV_ACTIVE_SPEAKER_RUNTIME_CERT_CONTRACT=PASS

      - name: Python compile gate
        run: |
          python -m py_compile services/svc-director/app/app/fusion_execution.py
          python -m py_compile services/svc-director/app/app/fusion_input_performance.py
          python -m py_compile services/svc-director/app/app/shared_scene_routes.py
          python -m py_compile services/svc-director/app/app/shared_scene_state_routes.py
          python -m py_compile services/svc-fusion/app/app/services/providers/omnihuman_adapter.py
          python -m py_compile services/svc-fusion-extension/app/app/api/routes/v3_scene_pricing.py
          python -m py_compile services/svc-fusion-extension/app/app/api/routes/v3_scene_stitch.py
          python -m py_compile services/svc-fusion-extension/app/app/services/stitch_service.py
          python -m py_compile services/svc-fusion-extension/app/app/workers/v3_scene_coordinator.py

      - name: OmniHuman shared-scene source contract
        run: python scripts/test-shared-scene-omnihuman-cinematic.py

      - name: Focused pricing source tests
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path("services/svc-fusion-extension/tests/test_v3_scene_pricing_omnihuman_shared.py")
          tests = [value for name, value in ns.items() if name.startswith("test_") and callable(value)]
          assert tests, "no focused pricing tests discovered"
          for test in tests:
              test()
          print("OMNIHUMAN_SHARED_SCENE_PRICING_TESTS=PASS")
          PY

      - name: No customer pricing regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("migrations/2026_10_03_group_conversation_premium_actual_seconds.sql").read_text()
          assert "'base_credits_per_second', 15" in p
          assert "'credits_per_second', 18" in p
          assert "'multi_person_surcharge_pct', 20" in p
          assert "pb.channel IN ('web', 'mobile')" in p
          print("GROUP_CUSTOMER_PRICING_18_CREDITS_PER_SECOND=PASS")
          print("GROUP_MULTI_PERSON_SURCHARGE_20PCT=PASS")
          PY

      - name: Login to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build immutable DEV runtime images
        if: github.event_name == 'push'
        run: |
          set -Eeuo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          docker build -f services/svc-director/app/Dockerfile.v3 -t "ghcr.io/${OWNER}/desifaces-svc-director:${GITHUB_SHA}" .
          docker build -f services/svc-fusion/app/Dockerfile -t "ghcr.io/${OWNER}/desifaces-svc-fusion:${GITHUB_SHA}" .
          docker build -f services/svc-fusion-extension/app/Dockerfile -t "ghcr.io/${OWNER}/desifaces-svc-fusion-extension:${GITHUB_SHA}" .
          echo OMNIHUMAN_RUNTIME_IMAGE_BUILD=PASS

      - name: Fusion shared-scene quality runtime smoke
        if: github.event_name == 'push'
        run: |
          set -Eeuo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/desifaces-svc-fusion:${GITHUB_SHA}"

          docker run --rm --entrypoint ffmpeg "$IMAGE" -version >/dev/null

          docker run --rm             --entrypoint python             -e DF_OMNIHUMAN_MODEL_ID="runtime-configured-model"             "$IMAGE"             -c '
          from app.services.providers.omnihuman_adapter import OmniHumanAdapter
          a = OmniHumanAdapter()
          assert a.provider_name == "omnihuman"
          assert a.shared_scene_mask_strategy == "active_only"
          assert a.shared_scene_audio_normalization is True
          assert a.shared_scene_audio_normalization_required is True
          assert a.shared_scene_dialogue_head_pad_ms == 300
          assert a.shared_scene_dialogue_tail_pad_ms == 400
          assert a.model_id == "runtime-configured-model"
          print("OMNIHUMAN_QUALITY_RUNTIME_SMOKE=PASS")
          '

          docker run --rm \
            --entrypoint python \
            -e DATABASE_URL="postgresql://ci:ci@localhost:5432/ci" \
            -e JWT_SECRET="ci-runtime-smoke-only" \
            -e AZURE_STORAGE_CONNECTION_STRING="UseDevelopmentStorage=true" \
            -e DF_SHARED_SCENE_TRANSITION_SECONDS="0.12" \
            "ghcr.io/${OWNER}/desifaces-svc-fusion-extension:${GITHUB_SHA}" \
            -c '
          from app.api.routes.v3_scene_stitch import _effective_scene_stitch_mode
          from app.services.stitch_service import _shared_dialogue_transition_seconds
          assert _effective_scene_stitch_mode("hard_cut", "shared_scene") == "shared_dialogue"
          assert abs(_shared_dialogue_transition_seconds() - 0.12) < 0.0001
          print("SHARED_DIALOGUE_TRANSITION_RUNTIME_SMOKE=PASS")
          '

          docker run --rm \
            --entrypoint python \
            -e DATABASE_URL="postgresql://ci:ci@localhost:5432/ci" \
            -e JWT_SECRET="ci-runtime-smoke-only" \
            -e AZURE_STORAGE_CONNECTION_STRING="UseDevelopmentStorage=true" \
            -e DF_SHARED_SCENE_TRANSITION_SECONDS="0.12" \
            "ghcr.io/${OWNER}/desifaces-svc-fusion-extension:${GITHUB_SHA}" \
            -c '
          import os, subprocess, tempfile
          from pathlib import Path
          from app.services.stitch_service import (
              stitch_videos,
              _probe_duration_seconds,
              _probe_video_dimensions,
              _probe_has_audio,
          )

          src = Path("/app/app/services/stitch_service.py").read_text()
          shared = src.split("if mode == \"shared_dialogue\":", 1)[1].split(
              "if mode in {\"xfade\", \"fade\"}:", 1
          )[0]
          assert "_xfade_pair(" not in shared
          assert "acrossfade" not in shared
          assert "audio_edge_fade=not shared_dialogue" in src

          with tempfile.TemporaryDirectory() as td:
              left = os.path.join(td, "left.mp4")
              right = os.path.join(td, "right.mp4")
              out = os.path.join(td, "out.mp4")

              subprocess.run([
                  "ffmpeg","-y","-loglevel","error",
                  "-f","lavfi","-i","color=c=blue:s=640x360:r=30:d=2.8",
                  "-f","lavfi","-i","sine=frequency=440:sample_rate=48000:duration=2.8",
                  "-map","0:v:0","-map","1:a:0",
                  "-c:v","libx264","-pix_fmt","yuv420p","-r","30",
                  "-c:a","aac","-ar","48000","-ac","1","-shortest",left
              ], check=True)

              subprocess.run([
                  "ffmpeg","-y","-loglevel","error",
                  "-f","lavfi","-i","color=c=red:s=642x362:r=30:d=2.6",
                  "-f","lavfi","-i","sine=frequency=660:sample_rate=48000:duration=2.6",
                  "-map","0:v:0","-map","1:a:0",
                  "-c:v","libx264","-pix_fmt","yuv420p","-r","30",
                  "-c:a","aac","-ar","48000","-ac","2","-shortest",right
              ], check=True)

              stitch_videos(
                  [left, right],
                  out,
                  stitch_mode_override="shared_dialogue",
                  aspect_ratio="16:9",
              )

              assert os.path.getsize(out) > 0
              assert _probe_video_dimensions(out) == (1920, 1080)
              assert _probe_has_audio(out)
              final_duration = float(_probe_duration_seconds(out) or 0.0)
              assert 5.34 <= final_duration <= 5.60, final_duration

              audio_duration = float(subprocess.check_output([
                  "ffprobe","-v","error","-select_streams","a:0",
                  "-show_entries","stream=duration",
                  "-of","default=noprint_wrappers=1:nokey=1",out
              ], text=True).strip())
              assert 5.34 <= audio_duration <= 5.60, audio_duration
              print("SHARED_DIALOGUE_VISUAL_ONLY_TRANSITION_RUNTIME=PASS")
              print("SHARED_DIALOGUE_AUDIO_IMMUTABILITY_RUNTIME=PASS")
              print("SHARED_DIALOGUE_FULL_DURATION_RUNTIME=PASS")
          '

          echo FUSION_FFMPEG_RUNTIME=PASS
          echo DIALOGUE_HANDLE_RUNTIME=PASS

      - name: Push immutable DEV runtime images
        if: github.event_name == 'push'
        run: |
          set -Eeuo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          for IMAGE in desifaces-svc-director desifaces-svc-fusion desifaces-svc-fusion-extension; do
            docker push "ghcr.io/${OWNER}/${IMAGE}:${GITHUB_SHA}"
          done
          echo OMNIHUMAN_RUNTIME_IMAGE_PUSH=PASS
