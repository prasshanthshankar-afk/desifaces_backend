  # -------------------------
  # Shared Studio Coach LLM Refresh Worker
  # -------------------------
  svc-studio-coach-refresh-worker:
    <<: *python_service
    healthcheck:
      disable: true
    container_name: df-svc-studio-coach-refresh-worker
    build:
      context: ./services/svc-core/app
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"

      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_DSN: ${DATABASE_URL}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}

      DF_STUDIO_COACH_REFRESH_ENABLED: ${DF_STUDIO_COACH_REFRESH_ENABLED:-true}
      DF_STUDIO_COACH_AUTO_ACTIVATE: ${DF_STUDIO_COACH_AUTO_ACTIVATE:-false}
      DF_STUDIO_COACH_REFRESH_INTERVAL_SECONDS: ${DF_STUDIO_COACH_REFRESH_INTERVAL_SECONDS:-21600}
      DF_STUDIO_COACH_REFRESH_MAX_TIPS: ${DF_STUDIO_COACH_REFRESH_MAX_TIPS:-8}
      DF_STUDIO_COACH_LLM_PROVIDER: ${DF_STUDIO_COACH_LLM_PROVIDER:-openai}
      DF_STUDIO_COACH_LLM_MODEL: ${DF_STUDIO_COACH_LLM_MODEL:-gpt-4.1-mini}
      DF_STUDIO_COACH_REFRESH_CONTEXTS_JSON: >-
        [
          {"studio":"face","modes":["text-to-image","image-to-image"],"locales":["en"]},
          {"studio":"audio","modes":["tts"],"locales":["en"]},
          {"studio":"fusion","modes":["talking_video","cinematic_video_direction"],"locales":["en"]}
        ]

      # The worker runs shared code from /app/services/shared/llm directly.
      # Do not use desifaces_shared.llm here; this repo's shared llm package is mounted below.
      PYTHONPATH: "/app:/app/services/shared:/app/services/shared/llm"
    volumes:
      - ./services/shared:/app/services/shared:ro
    command:
      - bash
      - -lc
      - |-
        set -euo pipefail
        echo "[studio-coach] verifying repo-aligned shared files"
        ls -l /app/services/shared/llm/studio_coach.py
        ls -l /app/services/shared/llm/studio_coach_refresh.py
        cd /app/services/shared/llm
        python - <<'PY'
        from __future__ import annotations

        import asyncio
        import json
        import os
        import signal
        import sys
        from typing import Any, Dict, List

        import asyncpg

        sys.path.insert(0, "/app/services/shared/llm")
        from studio_coach_refresh import RefreshConfig, refresh_many


        def _env_int(name: str, default: int) -> int:
            try:
                return int(str(os.getenv(name, str(default))).strip())
            except Exception:
                return default


        def _env_bool(name: str, default: bool = False) -> bool:
            raw = os.getenv(name)
            if raw is None:
                return default
            return raw.strip().lower() in {"1", "true", "yes", "on"}


        def _contexts() -> List[Dict[str, Any]]:
            raw = os.getenv("DF_STUDIO_COACH_REFRESH_CONTEXTS_JSON") or ""
            if raw.strip():
                parsed = json.loads(raw)
                if isinstance(parsed, list):
                    return [x for x in parsed if isinstance(x, dict)]
            return [
                {"studio": "face", "modes": ["text-to-image", "image-to-image"], "locales": ["en"]},
                {"studio": "audio", "modes": ["tts"], "locales": ["en"]},
                {"studio": "fusion", "modes": ["talking_video", "cinematic_video_direction"], "locales": ["en"]},
            ]


        async def _pool() -> asyncpg.Pool:
            dsn = os.getenv("DATABASE_URL") or os.getenv("POSTGRES_DSN")
            if not dsn:
                raise RuntimeError("DATABASE_URL is required")
            return await asyncpg.create_pool(
                dsn=dsn,
                min_size=1,
                max_size=max(1, _env_int("DF_STUDIO_COACH_REFRESH_DB_POOL_MAX", 3)),
            )


        async def main() -> None:
            interval = max(300, _env_int("DF_STUDIO_COACH_REFRESH_INTERVAL_SECONDS", 21600))
            run_once = _env_bool("DF_STUDIO_COACH_REFRESH_RUN_ONCE", False)
            stop = asyncio.Event()
            loop = asyncio.get_running_loop()
            for sig in (signal.SIGINT, signal.SIGTERM):
                try:
                    loop.add_signal_handler(sig, stop.set)
                except NotImplementedError:
                    pass

            config = RefreshConfig.from_env()
            print(json.dumps({"event": "studio_coach_refresh_worker_started", "contexts": _contexts(), "enabled": config.enabled, "auto_activate": config.auto_activate}), flush=True)
            pool = await _pool()
            try:
                while not stop.is_set():
                    all_results = []
                    for ctx in _contexts():
                        studio = str(ctx.get("studio") or "").strip()
                        modes = [str(x).strip() for x in (ctx.get("modes") or []) if str(x).strip()]
                        locales = [str(x).strip() for x in (ctx.get("locales") or ["en"]) if str(x).strip()]
                        if not studio or not modes:
                            continue
                        results = await refresh_many(pool, studios=[studio], modes=modes, locales=locales, config=config)
                        all_results.extend(results)
                    print(json.dumps({"event": "studio_coach_refresh_complete", "results": [r.model_dump() for r in all_results]}, default=str), flush=True)
                    if run_once:
                        break
                    try:
                        await asyncio.wait_for(stop.wait(), timeout=interval)
                    except asyncio.TimeoutError:
                        continue
            finally:
                await pool.close()


        asyncio.run(main())
        PY

