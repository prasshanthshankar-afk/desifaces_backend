  # -------------------------
  svc-fusion-extension:
    <<: *python_service
    container_name: df-svc-fusion-extension
    depends_on:
      desifaces-db:
        condition: service_healthy
      desifaces-redis:
        condition: service_started
      svc-pricing:
        condition: service_started
    build:
