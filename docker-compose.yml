  # -------------------------
  # Audio API
  # -------------------------
  svc-audio:
    <<: *python_service
    container_name: df-svc-audio
    depends_on:
      desifaces-db:
        condition: service_healthy
      desifaces-redis:
        condition: service_started
      svc-pricing:
        condition: service_started
    build:
      context: .
      dockerfile: services/svc-audio/app/Dockerfile
    image: desifaces-svc-audio
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      PORT: "8004"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # Required for DB-backed Studio Coach serving/ranking. svc-audio imports
      # shared LLM modules from the repo-mounted services/shared tree.
      PYTHONPATH: "/app:/app/services/shared:/app/services/shared/llm:/app/services/shared/python"

      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-desifaces}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-desifaces_clients}
      JWT_ALG: ${JWT_ALG:-HS256}

      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-eastus}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      AZURE_TRANSLATOR_KEY: ${AZURE_TRANSLATOR_KEY}
      AZURE_TRANSLATOR_ENDPOINT: ${AZURE_TRANSLATOR_ENDPOINT:-https://api.cognitive.microsofttranslator.com}
      AZURE_TRANSLATOR_REGION: ${AZURE_TRANSLATOR_REGION:-eastus}

      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AUDIO_OUTPUT_CONTAINER: ${AUDIO_OUTPUT_CONTAINER:-audio-output}
      AUDIO_SAS_HOURS: ${AUDIO_SAS_HOURS:-24}

      DF_PRICING_ENABLED: ${DF_PRICING_ENABLED:-true}
      DF_PRICING_REQUIRED: ${DF_PRICING_REQUIRED:-1}
      DF_PRICING_URL: ${DF_PRICING_URL:-http://svc-pricing:8009}
      DF_PRICING_TIMEOUT_S: ${DF_PRICING_TIMEOUT_S:-10}
      DF_PRICING_BEARER_TOKEN: ${DF_PRICING_INTERNAL_BEARER}

      DF_NOTIFICATIONS_URL: ${DF_NOTIFICATIONS_URL:-http://svc-core:8000}
      DF_NOTIFICATIONS_BEARER: ${DF_NOTIFICATIONS_BEARER:-${SVC_TO_SVC_BEARER:-${DF_PRICING_INTERNAL_BEARER}}}

    volumes:
      # Read-only shared code mount for Studio Coach ranker/tips.
      - ./services/shared:/app/services/shared:ro

    expose: ["8004"]
    ports: ["8004:8004"]
    healthcheck:
      <<: *python_http_healthcheck
      start_period: 20s

  # -------------------------
  # Audio Worker
  # -------------------------
  svc-audio-worker:
    <<: *python_service
    healthcheck:
      disable: true
    container_name: df-svc-audio-worker
    depends_on:
      desifaces-db:
        condition: service_healthy
      desifaces-redis:
        condition: service_started
      svc-pricing:
        condition: service_started
    build:
      context: .
      dockerfile: services/svc-audio/app/Dockerfile
    image: desifaces-svc-audio-worker
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # Keep worker runtime aligned with svc-audio API.
      PYTHONPATH: "/app:/app/services/shared:/app/services/shared/llm:/app/services/shared/python"

      AUDIO_STUDIO_TYPE: "audio"
      WORKER_POLL_SECS: "1.5"
      WORKER_BATCH_SIZE: "1"

      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-desifaces}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-desifaces_clients}
      JWT_ALG: ${JWT_ALG:-HS256}

      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-eastus}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      AZURE_TRANSLATOR_KEY: ${AZURE_TRANSLATOR_KEY}
      AZURE_TRANSLATOR_ENDPOINT: ${AZURE_TRANSLATOR_ENDPOINT:-https://api.cognitive.microsofttranslator.com}
      AZURE_TRANSLATOR_REGION: ${AZURE_TRANSLATOR_REGION:-eastus}

      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AUDIO_OUTPUT_CONTAINER: ${AUDIO_OUTPUT_CONTAINER:-audio-output}
      AUDIO_SAS_HOURS: ${AUDIO_SAS_HOURS:-24}

      DF_PRICING_ENABLED: ${DF_PRICING_ENABLED:-true}
      DF_PRICING_REQUIRED: ${DF_PRICING_REQUIRED:-1}
      DF_PRICING_URL: ${DF_PRICING_URL:-http://svc-pricing:8009}
      DF_PRICING_TIMEOUT_S: ${DF_PRICING_TIMEOUT_S:-10}
      DF_PRICING_BEARER_TOKEN: ${DF_PRICING_INTERNAL_BEARER}

      DF_NOTIFICATIONS_URL: ${DF_NOTIFICATIONS_URL:-http://svc-core:8000}
      DF_NOTIFICATIONS_BEARER: ${DF_NOTIFICATIONS_BEARER:-${SVC_TO_SVC_BEARER:-${DF_PRICING_INTERNAL_BEARER}}}

    volumes:
      # Read-only shared code mount for any shared Audio/Studio Coach runtime imports.
      - ./services/shared:/app/services/shared:ro

    command: ["bash", "-lc", "python -m app.workers.audio_worker"]

  # -------------------------
