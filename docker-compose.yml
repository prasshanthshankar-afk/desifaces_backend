name: desifaces

x-common-env: &common_env
  env_file:
    - ./infra/.env

x-common-python-service: &python_service
  <<: *common_env
  init: true
  restart: unless-stopped
  stop_grace_period: 20s
  networks: [df-net]
  depends_on:
    desifaces-db:
      condition: service_healthy
    desifaces-redis:
      condition: service_started
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-one-shot-python-job: &one_shot_python_job
  <<: *common_env
  init: true
  restart: "no"
  stop_grace_period: 20s
  networks: [df-net]
  depends_on:
    desifaces-db:
      condition: service_healthy
    desifaces-redis:
      condition: service_started
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-notification-env: &notification_env
  DF_NOTIFICATION_PUSH_PROVIDER: ${DF_NOTIFICATION_PUSH_PROVIDER:-expo}
  DF_EXPO_PUSH_URL: ${DF_EXPO_PUSH_URL:-https://exp.host/--/api/v2/push/send}

  DF_NOTIFICATION_EMAIL_PROVIDER: ${DF_NOTIFICATION_EMAIL_PROVIDER:-smtp}
  DF_SMTP_HOST: ${DF_SMTP_HOST:-smtp-relay.gmail.com}
  DF_SMTP_PORT: ${DF_SMTP_PORT:-587}
  DF_SMTP_USERNAME: ${DF_SMTP_USERNAME:-}
  DF_SMTP_PASSWORD: ${DF_SMTP_PASSWORD:-}
  DF_SMTP_USE_TLS: ${DF_SMTP_USE_TLS:-1}
  DF_SMTP_EHLO_DOMAIN: ${DF_SMTP_EHLO_DOMAIN:-mail.desifaces.ai}

  DF_EMAIL_FROM: ${DF_EMAIL_FROM:-noreply@desifaces.ai}
  DF_SUPPORT_EMAIL_TO: ${DF_SUPPORT_EMAIL_TO:-support@desifaces.ai}

  DF_NOTIFICATION_BATCH_LIMIT: ${DF_NOTIFICATION_BATCH_LIMIT:-100}
  DF_NOTIFICATION_HTTP_TIMEOUT_SEC: ${DF_NOTIFICATION_HTTP_TIMEOUT_SEC:-20}
  DF_NOTIFICATION_STALE_PROCESSING_AFTER_MINUTES: ${DF_NOTIFICATION_STALE_PROCESSING_AFTER_MINUTES:-20}

x-python-http-healthcheck: &python_http_healthcheck
  test:
    - CMD-SHELL
    - >-
      python -c "import os, urllib.request;
      urllib.request.urlopen(f'http://127.0.0.1:{os.environ[\"PORT\"]}/api/health', timeout=3);
      print('ok')"
  interval: 5s
  timeout: 3s
  retries: 30

services:
  # -------------------------
  # Database
  # -------------------------
  desifaces-db:
    image: pgvector/pgvector:pg16
    container_name: desifaces-db
    networks: [df-net]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-desifaces}
      POSTGRES_USER: ${POSTGRES_USER:-desifaces_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desifaces_mahadev}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "15432:5432"
    volumes:
      - df_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------
  # Redis
  # -------------------------
  desifaces-redis:
    image: redis:7-alpine
    container_name: desifaces-redis
    networks: [df-net]
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - df_redisdata:/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------
  # Core API
  # -------------------------
  svc-core:
    <<: *python_service
    container_name: df-svc-core
    depends_on:
      desifaces-db:
        condition: service_healthy
      desifaces-redis:
        condition: service_started
      svc-pricing:
        condition: service_healthy
    build:
      context: ./services/svc-core/app
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET}
      REFRESH_TOKEN_HMAC_SECRET: ${REFRESH_TOKEN_HMAC_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-desifaces}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-desifaces_clients}
      PYTHONPATH: "/app"

      # pricing bootstrap for new free users
      DF_PRICING_INTERNAL_URL: ${DF_PRICING_INTERNAL_URL:-http://svc-pricing:8009}
      DF_PRICING_INTERNAL_BEARER: ${DF_PRICING_INTERNAL_BEARER}
      SVC_TO_SVC_BEARER: ${SVC_TO_SVC_BEARER:-${DF_PRICING_INTERNAL_BEARER}}

      <<: *notification_env

      DF_NOTIFICATIONS_URL: ${DF_NOTIFICATIONS_URL:-http://svc-core:8000}
      DF_NOTIFICATIONS_BEARER: ${DF_NOTIFICATIONS_BEARER:-${SVC_TO_SVC_BEARER:-${DF_PRICING_INTERNAL_BEARER}}}
    expose: ["8000"]
    ports: ["8000:8000"]
    healthcheck:
      <<: *python_http_healthcheck
      start_period: 15s

  # -------------------------
  # Core Notification Dispatcher Job (one-shot, externally scheduled)
  # -------------------------
  svc-core-notification-worker:
    <<: *one_shot_python_job
    profiles: ["ops"]
    depends_on:
      desifaces-db:
        condition: service_healthy
      desifaces-redis:
        condition: service_started
      svc-core:
        condition: service_healthy
      svc-pricing:
        condition: service_healthy
    build:
      context: ./services/svc-core/app
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PYTHONPATH: "/app"
      <<: *notification_env
    command: ["python", "-m", "app.scripts.run_notification_dispatcher", "--limit", "200"]

  # -------------------------
  # Fusion API
  # -------------------------
  svc-fusion:
    <<: *python_service
    container_name: df-svc-fusion
    depends_on:
      desifaces-db:
        condition: service_healthy
      desifaces-redis:
        condition: service_started
      svc-pricing:
        condition: service_started
    build:
      context: .
      dockerfile: services/svc-fusion/app/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      PORT: "8002"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      PYTHONPATH: "/app"

      DF_FUSION_STUDIO_ENABLED: ${DF_FUSION_STUDIO_ENABLED:-true}
      DF_VEED_FABRIC_MODEL_ID: ${DF_VEED_FABRIC_MODEL_ID:-veed/fabric-1.0}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET}
      REFRESH_TOKEN_HMAC_SECRET: ${REFRESH_TOKEN_HMAC_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-desifaces}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-desifaces_clients}

      HEYGEN_API_KEY: ${DF_HEYGEN_API_KEY}
      HEYGEN_BASE_URL: ${DF_HEYGEN_BASE_URL:-https://api.heygen.com}
      HEYGEN_ENABLE_VIDEO_LIST_FALLBACK: ${HEYGEN_ENABLE_VIDEO_LIST_FALLBACK:-1}
      HEYGEN_SUBMIT_PATH: ${HEYGEN_SUBMIT_PATH:-}

      DF_FUSION_DISABLE_CREATE_DEDUPE: ${DF_FUSION_DISABLE_CREATE_DEDUPE:-1}
      DF_FUSION_PROVIDER_TIMEOUT_SECONDS: ${DF_FUSION_PROVIDER_TIMEOUT_SECONDS:-360}
      DF_FUSION_PROVIDER_POLL_SECONDS: ${DF_FUSION_PROVIDER_POLL_SECONDS:-5}
      FUSION_JOB_TIMEOUT_SECONDS: ${FUSION_JOB_TIMEOUT_SECONDS:-420}

      DF_PRICING_ENABLED: ${DF_PRICING_ENABLED:-true}
      DF_PRICING_REQUIRED: ${DF_PRICING_REQUIRED:-1}
      DF_PRICING_URL: ${DF_PRICING_URL:-http://svc-pricing:8009}
      DF_PRICING_TIMEOUT_S: ${DF_PRICING_TIMEOUT_S:-10}
      DF_PRICING_BEARER_TOKEN: ${DF_PRICING_INTERNAL_BEARER}

    expose: ["8002"]
    ports: ["8002:8002"]
    healthcheck:
      <<: *python_http_healthcheck
      start_period: 20s

  # -------------------------
  # Fusion Worker
  # -------------------------
  svc-fusion-worker:
    <<: *python_service
    healthcheck:
      disable: true
    container_name: df-svc-fusion-worker
    depends_on:
      desifaces-db:
        condition: service_healthy
      desifaces-redis:
        condition: service_started
      svc-pricing:
        condition: service_started
    build:
      context: .
      dockerfile: services/svc-fusion/app/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      PYTHONPATH: "/app"

      HEYGEN_API_KEY: ${DF_HEYGEN_API_KEY}
      HEYGEN_BASE_URL: ${DF_HEYGEN_BASE_URL:-https://api.heygen.com}
      HEYGEN_ENABLE_VIDEO_LIST_FALLBACK: ${HEYGEN_ENABLE_VIDEO_LIST_FALLBACK:-1}
      HEYGEN_SUBMIT_PATH: ${HEYGEN_SUBMIT_PATH:-}

      DF_FUSION_STUDIO_ENABLED: ${DF_FUSION_STUDIO_ENABLED:-true}
      DF_VEED_FABRIC_MODEL_ID: ${DF_VEED_FABRIC_MODEL_ID:-veed/fabric-1.0}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET}
      REFRESH_TOKEN_HMAC_SECRET: ${REFRESH_TOKEN_HMAC_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-desifaces}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-desifaces_clients}

      DF_FUSION_PROVIDER_TIMEOUT_SECONDS: ${DF_FUSION_PROVIDER_TIMEOUT_SECONDS:-360}
      DF_FUSION_PROVIDER_POLL_SECONDS: ${DF_FUSION_PROVIDER_POLL_SECONDS:-5}
      FUSION_JOB_TIMEOUT_SECONDS: ${FUSION_JOB_TIMEOUT_SECONDS:-420}

      DF_PRICING_ENABLED: ${DF_PRICING_ENABLED:-true}
      DF_PRICING_REQUIRED: ${DF_PRICING_REQUIRED:-1}
      DF_PRICING_URL: ${DF_PRICING_URL:-http://svc-pricing:8009}
      DF_PRICING_TIMEOUT_S: ${DF_PRICING_TIMEOUT_S:-10}
      DF_PRICING_BEARER_TOKEN: ${DF_PRICING_INTERNAL_BEARER}

    command: ["bash", "-lc", "python -m app.workers.fusion_worker"]

  # -------------------------
  # Face API
  # -------------------------
  svc-face:
    <<: *python_service
    container_name: df-svc-face
    build:
      context: .
      dockerfile: services/svc-face/app/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      PORT: "8003"
      UVICORN_WORKERS: ${SVC_FACE_UVICORN_WORKERS:-2}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      FACE_OUTPUT_CONTAINER: ${FACE_OUTPUT_CONTAINER:-face-output}
      PYTHONPATH: "/app"

      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-desifaces}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-desifaces_clients}

      FAL_API_KEY: ${FAL_API_KEY}
      FAL_MODEL: ${FAL_MODEL:-fal-ai/flux-pro/v1.1}

      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}

      AZURE_CONTENT_MODERATOR_ENDPOINT: ${AZURE_CONTENT_MODERATOR_ENDPOINT}
      AZURE_CONTENT_MODERATOR_KEY: ${AZURE_CONTENT_MODERATOR_KEY}

      DF_PRICING_ENABLED: ${DF_PRICING_ENABLED:-true}
      DF_PRICING_URL: ${DF_PRICING_URL:-http://svc-pricing:8009}
      DF_PRICING_TIMEOUT_S: ${DF_PRICING_TIMEOUT_S:-10}
      DF_PRICING_BEARER_TOKEN: ${DF_PRICING_INTERNAL_BEARER}

      DF_NOTIFICATIONS_URL: ${DF_NOTIFICATIONS_URL:-http://svc-core:8000}
      DF_NOTIFICATIONS_BEARER: ${DF_NOTIFICATIONS_BEARER:-${SVC_TO_SVC_BEARER:-${DF_PRICING_INTERNAL_BEARER}}}

    command:
      [
        "bash",
        "-lc",
        "uvicorn app.main:app --host 0.0.0.0 --port $${PORT} --workers $${UVICORN_WORKERS:-2} --log-level $${LOG_LEVEL:-info}"
      ]
    expose: ["8003"]
    ports: ["8003:8003"]
    healthcheck:
      <<: *python_http_healthcheck
      start_period: 30s

  # -------------------------
  # Face Worker
  # -------------------------
  svc-face-worker:
    <<: *python_service
    container_name: df-svc-face-worker
    build:
      context: .
      dockerfile: services/svc-face/app/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      FACE_OUTPUT_CONTAINER: ${FACE_OUTPUT_CONTAINER:-face-output}
      PYTHONPATH: "/app"

      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: ${JWT_ALG:-HS256}

      FAL_API_KEY: ${FAL_API_KEY}
      FAL_MODEL: ${FAL_MODEL:-fal-ai/flux-pro/v1.1}

      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}

      AZURE_CONTENT_MODERATOR_ENDPOINT: ${AZURE_CONTENT_MODERATOR_ENDPOINT}
      AZURE_CONTENT_MODERATOR_KEY: ${AZURE_CONTENT_MODERATOR_KEY}

      DF_PRICING_ENABLED: ${DF_PRICING_ENABLED:-true}
      DF_PRICING_URL: ${DF_PRICING_URL:-http://svc-pricing:8009}
      DF_PRICING_TIMEOUT_S: ${DF_PRICING_TIMEOUT_S:-10}
      DF_PRICING_BEARER_TOKEN: ${DF_PRICING_INTERNAL_BEARER}

      DF_NOTIFICATIONS_URL: ${DF_NOTIFICATIONS_URL:-http://svc-core:8000}
      DF_NOTIFICATIONS_BEARER: ${DF_NOTIFICATIONS_BEARER:-${SVC_TO_SVC_BEARER:-${DF_PRICING_INTERNAL_BEARER}}}

    # Background worker: verify the container's main process exists.
    healthcheck:
      test: ["CMD-SHELL", "test -r /proc/1/status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

    command: ["bash", "-lc", "python -m app.workers.face_worker"]

  # -------------------------
  # Pricing API
  # -------------------------
  svc-pricing:
    <<: *python_service
    container_name: df-svc-pricing
    build:
      context: ./services/svc-pricing/app
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      PORT: "8009"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PYTHONPATH: "/app"

      JWT_SECRET: ${JWT_SECRET}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-desifaces}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-desifaces_clients}

      DF_APPLE_IAP_ENABLE: "true"
      DF_APPLE_IAP_VERIFICATION_MODE: "decode_only"

      # Google Play Billing / Android IAP verification.
      # The JSON file is mounted below as read-only and must never be committed to Git.
      DF_GOOGLE_PLAY_IAP_ENABLE: "${DF_GOOGLE_PLAY_IAP_ENABLE:-1}"
      GOOGLE_PLAY_PACKAGE_NAME: "${GOOGLE_PLAY_PACKAGE_NAME:-ai.desifaces.app}"
      GOOGLE_PLAY_VALIDATE_PURCHASES: "${GOOGLE_PLAY_VALIDATE_PURCHASES:-1}"
      GOOGLE_PLAY_ACKNOWLEDGE_PURCHASES: "${GOOGLE_PLAY_ACKNOWLEDGE_PURCHASES:-1}"
      GOOGLE_PLAY_VERIFICATION_MODE: "${GOOGLE_PLAY_VERIFICATION_MODE:-google_api}"
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PATH: "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PATH:-/run/secrets/google_play_service_account.json}"

      DF_PRICING_INTERNAL_BEARER: ${DF_PRICING_INTERNAL_BEARER}
      DF_PRICING_ALLOWED_SERVICES: ${DF_PRICING_ALLOWED_SERVICES:-svc-core,svc-face,svc-fusion,svc-fusion-extension,svc-audio,svc-commerce,svc-music,svc-marketing}
    volumes:
      - /opt/desifaces/secrets/google_play_service_account.json:/run/secrets/google_play_service_account.json:ro
    expose: ["8009"]
    ports: ["8009:8009"]
    command: ["bash", "-lc", "uvicorn app.main:app --host 0.0.0.0 --port $${PORT:-8009}"]
    healthcheck:
      <<: *python_http_healthcheck
      start_period: 30s

  # -------------------------
  # Commerce API
  # -------------------------
  svc-commerce:
    <<: *python_service
    container_name: df-svc-commerce
    depends_on:
      desifaces-db:
        condition: service_healthy
      desifaces-redis:
        condition: service_started
      svc-pricing:
        condition: service_started
    build:
      context: .
      dockerfile: services/svc-commerce/app/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      PORT: "8008"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      PYTHONPATH: "/app"
      

      COMMERCE_SAREE_BLENDER_ENGINE: ${COMMERCE_SAREE_BLENDER_ENGINE:-BLENDER_EEVEE_NEXT}
      DF_SAREE_BLENDER_ENGINE: ${DF_SAREE_BLENDER_ENGINE:-BLENDER_EEVEE_NEXT}

      COMMERCE_SAREE_STRICT: ${COMMERCE_SAREE_STRICT:-1}
      COMMERCE_ENABLE_SAREE_DRAPE_PROVIDER: ${COMMERCE_ENABLE_SAREE_DRAPE_PROVIDER:-1}
      COMMERCE_ENABLE_SAREE_PLATFORM_MODEL_AUTO_PICK: ${COMMERCE_ENABLE_SAREE_PLATFORM_MODEL_AUTO_PICK:-1}

      COMMERCE_SAREE_TEMPLATE_PATH: ${COMMERCE_SAREE_TEMPLATE_PATH:-az://commerce-training/drape_templates/saree/nivi/v1/nivi.blend}
      COMMERCE_SAREE_ALPHA_MASK_PATH: ${COMMERCE_SAREE_ALPHA_MASK_PATH:-az://commerce-training/drape_templates/saree/nivi/v1/masks/saree_alpha.png}
      COMMERCE_SAREE_PALLU_MASK_PATH: ${COMMERCE_SAREE_PALLU_MASK_PATH:-az://commerce-training/drape_templates/saree/nivi/v1/masks/pallu_alpha.png}

      COMMERCE_SAREE_CACHE_DIR: ${COMMERCE_SAREE_CACHE_DIR:-/var/cache/df_saree_templates}
      DF_SAREE_CACHE_DIR: ${COMMERCE_SAREE_CACHE_DIR:-/var/cache/df_saree_templates}
      DF_SAREE_TEMPLATE_CACHE_DIR: ${COMMERCE_SAREE_CACHE_DIR:-/var/cache/df_saree_templates}
      DF_SAREE_RUN_DIR_BASE: /var/cache/df_saree_drape_runs

      DF_SAREE_VALIDATE_TEMPLATE: ${DF_SAREE_VALIDATE_TEMPLATE:-1}
      DF_SAREE_REQUIRE_RENDER_META_OK: ${DF_SAREE_REQUIRE_RENDER_META_OK:-1}
      DF_SAREE_QC_ENABLED: ${DF_SAREE_QC_ENABLED:-1}
      DF_SAREE_RENDER_ENGINE_FALLBACK: ${DF_SAREE_RENDER_ENGINE_FALLBACK:-BLENDER_EEVEE_NEXT}

      DF_SAREE_TEXTURE_TILE: ${DF_SAREE_TEXTURE_TILE:-1}
      DF_SAREE_TEXTURE_TILE_SIZE: ${DF_SAREE_TEXTURE_TILE_SIZE:-1024}
      DF_SAREE_TEXTURE_TILE_BG_THRESH: ${DF_SAREE_TEXTURE_TILE_BG_THRESH:-28}

      COMMERCE_SAREE_ANCHOR_WARP: ${COMMERCE_SAREE_ANCHOR_WARP:-1}
      DF_SAREE_ANCHOR_WARP: ${DF_SAREE_ANCHOR_WARP:-1}

      COMMERCE_ENFORCE_FULL_BODY_FOR_SAREE: ${COMMERCE_ENFORCE_FULL_BODY_FOR_SAREE:-0}

      JWT_SECRET: ${JWT_SECRET}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-desifaces}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-desifaces_clients}

      PRICING_SERVICE_URL: ${PRICING_SERVICE_URL:-}
      COMMERCE_QUOTE_TTL_SECONDS: ${COMMERCE_QUOTE_TTL_SECONDS:-900}
      COMMERCE_CREDIT_USD_RATE: ${COMMERCE_CREDIT_USD_RATE:-0.03}
      COMMERCE_CREDIT_INR_RATE: ${COMMERCE_CREDIT_INR_RATE:-2.5}
      COMMERCE_CREDITS_PER_IMAGE: ${COMMERCE_CREDITS_PER_IMAGE:-30}
      COMMERCE_CREDITS_PER_VIDEO: ${COMMERCE_CREDITS_PER_VIDEO:-120}
      COMMERCE_CREDITS_PER_CHANNEL_EXPORT: ${COMMERCE_CREDITS_PER_CHANNEL_EXPORT:-10}
      COMMERCE_CREDITS_MARKETPLACE_PACK: ${COMMERCE_CREDITS_MARKETPLACE_PACK:-25}

      DF_PRICING_ENABLED: ${DF_PRICING_ENABLED:-true}
      DF_PRICING_REQUIRED: ${DF_PRICING_REQUIRED:-1}
      DF_PRICING_URL: ${DF_PRICING_URL:-http://svc-pricing:8009}
      DF_PRICING_TIMEOUT_S: ${DF_PRICING_TIMEOUT_S:-10}
      DF_PRICING_BEARER_TOKEN: ${DF_PRICING_INTERNAL_BEARER}

      DF_PRICING_VARIANT_COMMERCE: ${DF_PRICING_VARIANT_COMMERCE:-}
      DF_PRICING_VARIANT_COMMERCE_APPAREL: ${DF_PRICING_VARIANT_COMMERCE_APPAREL:-COMMERCE_VTON_APPAREL_STANDARD}
      DF_PRICING_VARIANT_COMMERCE_APPAREL_PREMIUM: ${DF_PRICING_VARIANT_COMMERCE_APPAREL_PREMIUM:-COMMERCE_VTON_APPAREL_PREMIUM}
