  # -------------------------
  svc-dashboard:
    <<: *python_service
    container_name: df-svc-dashboard
    build:
      context: ./services/svc-dashboard/app
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: "0.0.0.0"
      PORT: "8005"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
