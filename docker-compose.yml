name: desifaces

x-common-env: &common_env
  env_file:
    - ./infra/.env

x-common-python-service: &python_service
  <<: *common_env
  init: true
  restart: unless-stopped
  stop_grace_period: 20s
  networks: [df-net]
  depends_on:
    desifaces-db:
      condition: service_healthy
    desifaces-redis:
      condition: service_started
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # -------------------------
  # Database
  # -------------------------
  desifaces-db:
    image: pgvector/pgvector:pg16
    container_name: desifaces-db
    networks: [df-net]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-desifaces}
      POSTGRES_USER: ${POSTGRES_USER:-desifaces_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desifaces_mahadev}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "15432:5432"
    volumes:
      - df_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  # -------------------------
  # Redis
  # -------------------------
  desifaces-redis:
    image: redis:7-alpine
    container_name: desifaces-redis
    networks: [df-net]
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - df_redisdata:/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  # -------------------------
  # Core API
  # -------------------------
  svc-core:
    <<: *python_service
    container_name: df-svc-core
    build:
      context: ./services/svc-core/app
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET}
      REFRESH_TOKEN_HMAC_SECRET: ${REFRESH_TOKEN_HMAC_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-desifaces}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-desifaces_clients}
      PYTHONPATH: "/app"
    expose: ["8000"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT}/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  # -------------------------
  # Fusion API
  # -------------------------
  svc-fusion:
    <<: *python_service
    container_name: df-svc-fusion
    build:
      context: ./services/svc-fusion/app
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      PORT: "8002"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      PYTHONPATH: "/app"

      DF_FUSION_STUDIO_ENABLED: ${DF_FUSION_STUDIO_ENABLED:-true}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-desifaces}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-desifaces_clients}

      HEYGEN_API_KEY: ${DF_HEYGEN_API_KEY}
      HEYGEN_BASE_URL: ${DF_HEYGEN_BASE_URL:-https://api.heygen.com}
    expose: ["8002"]
    ports: ["8002:8002"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT}/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # -------------------------
  # Fusion Worker
  # -------------------------
  svc-fusion-worker:
    <<: *python_service
    container_name: df-svc-fusion-worker
    build:
      context: ./services/svc-fusion/app
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      PYTHONPATH: "/app"

      HEYGEN_API_KEY: ${DF_HEYGEN_API_KEY}
      HEYGEN_BASE_URL: ${DF_HEYGEN_BASE_URL:-https://api.heygen.com}

      DF_FUSION_STUDIO_ENABLED: ${DF_FUSION_STUDIO_ENABLED:-true}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET}
      REFRESH_TOKEN_HMAC_SECRET: ${REFRESH_TOKEN_HMAC_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-desifaces}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-desifaces_clients}
    command: ["bash", "-lc", "python -m app.workers.fusion_worker"]

  # -------------------------
  # Face API
  # -------------------------
  svc-face:
    <<: *python_service
    container_name: df-svc-face
    build:
      context: ./services/svc-face/app
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      PORT: "8003"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      FACE_OUTPUT_CONTAINER: ${FACE_OUTPUT_CONTAINER:-face-output}
      PYTHONPATH: "/app"

      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-desifaces}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-desifaces_clients}

      FAL_API_KEY: ${FAL_API_KEY}
      FAL_MODEL: ${FAL_MODEL:-fal-ai/flux-pro/v1.1}

      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}

      AZURE_CONTENT_MODERATOR_ENDPOINT: ${AZURE_CONTENT_MODERATOR_ENDPOINT}
      AZURE_CONTENT_MODERATOR_KEY: ${AZURE_CONTENT_MODERATOR_KEY}
    expose: ["8003"]
    ports: ["8003:8003"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT}/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # -------------------------
  # Face Worker
  # -------------------------
  svc-face-worker:
    <<: *python_service
    container_name: df-svc-face-worker
    build:
      context: ./services/svc-face/app
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      FACE_OUTPUT_CONTAINER: ${FACE_OUTPUT_CONTAINER:-face-output}
      PYTHONPATH: "/app"

      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: ${JWT_ALG:-HS256}

      FAL_API_KEY: ${FAL_API_KEY}
      FAL_MODEL: ${FAL_MODEL:-fal-ai/flux-pro/v1.1}

      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}

      AZURE_CONTENT_MODERATOR_ENDPOINT: ${AZURE_CONTENT_MODERATOR_ENDPOINT}
      AZURE_CONTENT_MODERATOR_KEY: ${AZURE_CONTENT_MODERATOR_KEY}
    command: ["bash", "-lc", "python -m app.workers.face_worker"]

  # -------------------------
  # Commerce API
  # -------------------------
  svc-commerce:
    <<: *python_service
    container_name: df-svc-commerce
    build:
      context: ./services/svc-commerce/app
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      PORT: "8008"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      PYTHONPATH: "/app"

      # Blender / Saree drape
      COMMERCE_SAREE_BLENDER_ENGINE: ${COMMERCE_SAREE_BLENDER_ENGINE:-BLENDER_EEVEE_NEXT}
      DF_SAREE_BLENDER_ENGINE: ${DF_SAREE_BLENDER_ENGINE:-BLENDER_EEVEE_NEXT}

      # Saree overlay provider (production defaults)
      COMMERCE_SAREE_STRICT: ${COMMERCE_SAREE_STRICT:-1}
      COMMERCE_ENABLE_SAREE_DRAPE_PROVIDER: ${COMMERCE_ENABLE_SAREE_DRAPE_PROVIDER:-1}
      COMMERCE_SAREE_TEMPLATE_PATH: ${COMMERCE_SAREE_TEMPLATE_PATH:-az://commerce-training/drape_templates/saree/nivi/v1/nivi.blend}

      # ✅ STRICT requires this (mask must exist in Azure or local path)
      COMMERCE_SAREE_ALPHA_MASK_PATH: ${COMMERCE_SAREE_ALPHA_MASK_PATH:-az://commerce-training/drape_templates/saree/nivi/v1/alpha_mask_v1.png}

      # ✅ Deterministic cache dir (shared volume)
      COMMERCE_SAREE_CACHE_DIR: ${COMMERCE_SAREE_CACHE_DIR:-/var/cache/df_saree_templates}
      DF_SAREE_CACHE_DIR: ${COMMERCE_SAREE_CACHE_DIR:-/var/cache/df_saree_templates}
      DF_SAREE_TEMPLATE_CACHE_DIR: ${COMMERCE_SAREE_CACHE_DIR:-/var/cache/df_saree_templates}

      DF_SAREE_RUN_DIR_BASE: /var/cache/df_saree_drape_runs

      DF_SAREE_VALIDATE_TEMPLATE: ${DF_SAREE_VALIDATE_TEMPLATE:-1}
      DF_SAREE_REQUIRE_RENDER_META_OK: ${DF_SAREE_REQUIRE_RENDER_META_OK:-1}
      DF_SAREE_QC_ENABLED: ${DF_SAREE_QC_ENABLED:-1}
      DF_SAREE_RENDER_ENGINE_FALLBACK: ${DF_SAREE_RENDER_ENGINE_FALLBACK:-BLENDER_EEVEE_NEXT}

      DF_SAREE_TEXTURE_TILE: ${DF_SAREE_TEXTURE_TILE:-1}
      DF_SAREE_TEXTURE_TILE_SIZE: ${DF_SAREE_TEXTURE_TILE_SIZE:-1024}
      DF_SAREE_TEXTURE_TILE_BG_THRESH: ${DF_SAREE_TEXTURE_TILE_BG_THRESH:-28}

      COMMERCE_SAREE_ANCHOR_WARP: ${COMMERCE_SAREE_ANCHOR_WARP:-1}
      DF_SAREE_ANCHOR_WARP: ${DF_SAREE_ANCHOR_WARP:-1}

      COMMERCE_ENFORCE_FULL_BODY_FOR_SAREE: ${COMMERCE_ENFORCE_FULL_BODY_FOR_SAREE:-0}

      # JWT (match svc-core signing/claims)
      JWT_SECRET: ${JWT_SECRET}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-desifaces}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-desifaces_clients}

      # Pricing stub knobs (svc-pricing later)
      PRICING_SERVICE_URL: ${PRICING_SERVICE_URL:-}
      COMMERCE_QUOTE_TTL_SECONDS: ${COMMERCE_QUOTE_TTL_SECONDS:-900}
      COMMERCE_CREDIT_USD_RATE: ${COMMERCE_CREDIT_USD_RATE:-0.03}
      COMMERCE_CREDIT_INR_RATE: ${COMMERCE_CREDIT_INR_RATE:-2.5}
      COMMERCE_CREDITS_PER_IMAGE: ${COMMERCE_CREDITS_PER_IMAGE:-30}
      COMMERCE_CREDITS_PER_VIDEO: ${COMMERCE_CREDITS_PER_VIDEO:-120}
      COMMERCE_CREDITS_PER_CHANNEL_EXPORT: ${COMMERCE_CREDITS_PER_CHANNEL_EXPORT:-10}
      COMMERCE_CREDITS_MARKETPLACE_PACK: ${COMMERCE_CREDITS_MARKETPLACE_PACK:-25}

      # Providers
      FAL_API_KEY: ${FAL_API_KEY:-}
      FAL_MODEL: ${FAL_MODEL:-fal-ai/flux-pro/v1.1}

      # VTON (Fal)
      FAL_KEY: ${FAL_KEY:-}
      FAL_AUTH_MODE: ${FAL_AUTH_MODE:-key}
      COMMERCE_ENABLE_REAL_PROVIDERS: ${COMMERCE_ENABLE_REAL_PROVIDERS:-0}
      COMMERCE_VTON_PROVIDER: ${COMMERCE_VTON_PROVIDER:-fal}
      COMMERCE_MAX_PROVIDER_IMAGES: ${COMMERCE_MAX_PROVIDER_IMAGES:-1}

      COMMERCE_FAL_BASE_URL: ${COMMERCE_FAL_BASE_URL:-https://queue.fal.run}
      COMMERCE_FAL_FASHN_ENDPOINT_ID: ${COMMERCE_FAL_FASHN_ENDPOINT_ID:-fal-ai/fashn/tryon/v1.5}
      COMMERCE_FAL_ENDPOINT_ID: ${COMMERCE_FAL_ENDPOINT_ID:-fal-ai/leffa/virtual-tryon}

      # These are the names vton_provider.py reads
      COMMERCE_FAL_HTTP_TIMEOUT_S: ${COMMERCE_FAL_HTTP_TIMEOUT_S:-120}
      COMMERCE_FAL_POLL_TIMEOUT_S: ${COMMERCE_FAL_POLL_TIMEOUT_S:-180}
      COMMERCE_FAL_POLL_SECS: ${COMMERCE_FAL_POLL_SECS:-1.5}
      COMMERCE_FAL_POLL_LOGS: ${COMMERCE_FAL_POLL_LOGS:-0}

      # Demo mode
      COMMERCE_DEMO_MODE: ${COMMERCE_DEMO_MODE:-1}
      COMMERCE_DEMO_HUMAN_IMAGE_URL: ${COMMERCE_DEMO_HUMAN_IMAGE_URL:-https://storage.googleapis.com/falserverless/catvton/man5.jpg}
      COMMERCE_DEMO_GARMENT_IMAGE_URL: ${COMMERCE_DEMO_GARMENT_IMAGE_URL:-https://storage.googleapis.com/falserverless/catvton/tshirt.jpg}
      COMMERCE_FAL_CLOTH_TYPE: ${COMMERCE_FAL_CLOTH_TYPE:-upper}

      # Optional service-to-service (Docker DNS names)
      SVC_FUSION_BASE_URL: ${SVC_FUSION_BASE_URL:-http://svc-fusion:8002}
      SVC_AUDIO_BASE_URL: ${SVC_AUDIO_BASE_URL:-http://svc-audio:8004}

    volumes:
      - df_saree_templates_cache:/var/cache/df_saree_templates
      - df_saree_drape_runs:/var/cache/df_saree_drape_runs

    command: ["bash", "-lc", "uvicorn app.main:app --host 0.0.0.0 --port $${PORT:-8008}"]
    expose: ["8008"]
    ports: ["8008:8008"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT}/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # -------------------------
  # Commerce Worker
  # -------------------------
  svc-commerce-worker:
    <<: *python_service
    container_name: df-svc-commerce-worker
    build:
      context: ./services/svc-commerce/app
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      PYTHONPATH: "/app"

      # Blender / Saree drape
      COMMERCE_SAREE_BLENDER_ENGINE: ${COMMERCE_SAREE_BLENDER_ENGINE:-BLENDER_EEVEE_NEXT}
      DF_SAREE_BLENDER_ENGINE: ${DF_SAREE_BLENDER_ENGINE:-BLENDER_EEVEE_NEXT}

      # Saree overlay provider (production defaults)
      COMMERCE_SAREE_STRICT: ${COMMERCE_SAREE_STRICT:-1}
      COMMERCE_ENABLE_SAREE_DRAPE_PROVIDER: ${COMMERCE_ENABLE_SAREE_DRAPE_PROVIDER:-1}
      COMMERCE_SAREE_TEMPLATE_PATH: ${COMMERCE_SAREE_TEMPLATE_PATH:-az://commerce-training/drape_templates/saree/nivi/v1/nivi.blend}

      # ✅ STRICT requires this
      COMMERCE_SAREE_ALPHA_MASK_PATH: ${COMMERCE_SAREE_ALPHA_MASK_PATH:-az://commerce-training/drape_templates/saree/nivi/v1/alpha_mask_v1.png}

      # ✅ Deterministic cache dir (shared volume)
      COMMERCE_SAREE_CACHE_DIR: ${COMMERCE_SAREE_CACHE_DIR:-/var/cache/df_saree_templates}
      DF_SAREE_CACHE_DIR: ${COMMERCE_SAREE_CACHE_DIR:-/var/cache/df_saree_templates}
      DF_SAREE_TEMPLATE_CACHE_DIR: ${COMMERCE_SAREE_CACHE_DIR:-/var/cache/df_saree_templates}

      DF_SAREE_RUN_DIR_BASE: /var/cache/df_saree_drape_runs

      DF_SAREE_VALIDATE_TEMPLATE: ${DF_SAREE_VALIDATE_TEMPLATE:-1}
      DF_SAREE_REQUIRE_RENDER_META_OK: ${DF_SAREE_REQUIRE_RENDER_META_OK:-1}
      DF_SAREE_QC_ENABLED: ${DF_SAREE_QC_ENABLED:-1}
      DF_SAREE_QC_BLACK_THRESH: ${DF_SAREE_QC_BLACK_THRESH:-10}
      DF_SAREE_QC_OVERLAY_ALPHA_MIN_MAX: ${DF_SAREE_QC_OVERLAY_ALPHA_MIN_MAX:-8}
      DF_SAREE_RENDER_ENGINE_FALLBACK: ${DF_SAREE_RENDER_ENGINE_FALLBACK:-BLENDER_EEVEE_NEXT}

      DF_SAREE_TEXTURE_TILE: ${DF_SAREE_TEXTURE_TILE:-1}
      DF_SAREE_TEXTURE_TILE_SIZE: ${DF_SAREE_TEXTURE_TILE_SIZE:-1024}
      DF_SAREE_TEXTURE_TILE_BG_THRESH: ${DF_SAREE_TEXTURE_TILE_BG_THRESH:-28}

      COMMERCE_SAREE_ANCHOR_WARP: ${COMMERCE_SAREE_ANCHOR_WARP:-1}
      DF_SAREE_ANCHOR_WARP: ${DF_SAREE_ANCHOR_WARP:-1}

      DF_SAREE_KEEP_RUN_DIR: ${DF_SAREE_KEEP_RUN_DIR:-0}
      DF_SAREE_UPLOAD_DEBUG_OVERLAY: ${DF_SAREE_UPLOAD_DEBUG_OVERLAY:-0}
      DF_SAREE_UPLOAD_DEBUG_OVERLAY_WARPED: ${DF_SAREE_UPLOAD_DEBUG_OVERLAY_WARPED:-0}

      # JWT (match svc-core signing/claims)
      JWT_SECRET: ${JWT_SECRET}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-desifaces}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-desifaces_clients}

      # Pricing stub knobs (svc-pricing later)
      PRICING_SERVICE_URL: ${PRICING_SERVICE_URL:-}
      COMMERCE_QUOTE_TTL_SECONDS: ${COMMERCE_QUOTE_TTL_SECONDS:-900}
      COMMERCE_CREDIT_USD_RATE: ${COMMERCE_CREDIT_USD_RATE:-0.03}
      COMMERCE_CREDIT_INR_RATE: ${COMMERCE_CREDIT_INR_RATE:-2.5}
      COMMERCE_CREDITS_PER_IMAGE: ${COMMERCE_CREDITS_PER_IMAGE:-30}
      COMMERCE_CREDITS_PER_VIDEO: ${COMMERCE_CREDITS_PER_VIDEO:-120}
      COMMERCE_CREDITS_PER_CHANNEL_EXPORT: ${COMMERCE_CREDITS_PER_CHANNEL_EXPORT:-10}
      COMMERCE_CREDITS_MARKETPLACE_PACK: ${COMMERCE_CREDITS_MARKETPLACE_PACK:-25}

      COMMERCE_ENFORCE_FULL_BODY_FOR_SAREE: ${COMMERCE_ENFORCE_FULL_BODY_FOR_SAREE:-0}

      # Providers
      FAL_API_KEY: ${FAL_API_KEY:-}
      FAL_MODEL: ${FAL_MODEL:-fal-ai/flux-pro/v1.1}

      # ✅ VTON (Fal)
      FAL_KEY: ${FAL_KEY:-}
      FAL_AUTH_MODE: ${FAL_AUTH_MODE:-key}
      COMMERCE_ENABLE_REAL_PROVIDERS: ${COMMERCE_ENABLE_REAL_PROVIDERS:-0}
      COMMERCE_VTON_PROVIDER: ${COMMERCE_VTON_PROVIDER:-fal}
      COMMERCE_MAX_PROVIDER_IMAGES: ${COMMERCE_MAX_PROVIDER_IMAGES:-1}

      COMMERCE_FAL_BASE_URL: ${COMMERCE_FAL_BASE_URL:-https://queue.fal.run}
      COMMERCE_FAL_FASHN_ENDPOINT_ID: ${COMMERCE_FAL_FASHN_ENDPOINT_ID:-fal-ai/fashn/tryon/v1.5}
      COMMERCE_FAL_ENDPOINT_ID: ${COMMERCE_FAL_ENDPOINT_ID:-fal-ai/leffa/virtual-tryon}

      COMMERCE_FAL_HTTP_TIMEOUT_S: ${COMMERCE_FAL_HTTP_TIMEOUT_S:-120}
      COMMERCE_FAL_POLL_TIMEOUT_S: ${COMMERCE_FAL_POLL_TIMEOUT_S:-180}
      COMMERCE_FAL_POLL_SECS: ${COMMERCE_FAL_POLL_SECS:-1.5}
      COMMERCE_FAL_POLL_LOGS: ${COMMERCE_FAL_POLL_LOGS:-0}

      # Demo mode
      COMMERCE_DEMO_MODE: ${COMMERCE_DEMO_MODE:-1}
      COMMERCE_DEMO_HUMAN_IMAGE_URL: ${COMMERCE_DEMO_HUMAN_IMAGE_URL:-https://storage.googleapis.com/falserverless/catvton/man5.jpg}
      COMMERCE_DEMO_GARMENT_IMAGE_URL: ${COMMERCE_DEMO_GARMENT_IMAGE_URL:-https://storage.googleapis.com/falserverless/catvton/tshirt.jpg}
      COMMERCE_FAL_CLOTH_TYPE: ${COMMERCE_FAL_CLOTH_TYPE:-upper}

      # Worker tuning (optional)
      WORKER_POLL_SECS: ${COMMERCE_WORKER_POLL_SECS:-1.5}
      WORKER_BATCH_SIZE: ${COMMERCE_WORKER_BATCH_SIZE:-1}

    volumes:
      - df_saree_templates_cache:/var/cache/df_saree_templates
      - df_saree_drape_runs:/var/cache/df_saree_drape_runs
      - ./tmp:/host_tmp:ro

    command: ["bash", "-lc", "python -m app.workers.commerce_worker"]

  # -------------------------
  # Audio API
  # -------------------------
  svc-audio:
    <<: *python_service
    container_name: df-svc-audio
    build:
      context: ./services/svc-audio/app
      dockerfile: Dockerfile
    image: desifaces-svc-audio
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      PORT: "8004"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PYTHONPATH: "/app"

      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-desifaces}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-desifaces_clients}
      JWT_ALG: ${JWT_ALG:-HS256}

      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-eastus}
      AZURE_TRANSLATOR_KEY: ${AZURE_TRANSLATOR_KEY}
      AZURE_TRANSLATOR_ENDPOINT: ${AZURE_TRANSLATOR_ENDPOINT:-https://api.cognitive.microsofttranslator.com}
      AZURE_TRANSLATOR_REGION: ${AZURE_TRANSLATOR_REGION:-eastus}

      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AUDIO_OUTPUT_CONTAINER: ${AUDIO_OUTPUT_CONTAINER:-audio-output}
      AUDIO_SAS_HOURS: ${AUDIO_SAS_HOURS:-24}
