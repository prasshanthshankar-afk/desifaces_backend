services:
  svc-assistant:
    container_name: df-v3-svc-assistant
    image: desifaces-v3-svc-assistant
    build:
      context: .
      dockerfile: services/svc-assistant/app/Dockerfile.v3
    environment:
      DATABASE_URL: ${DATABASE_URL:?V3 DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://desifaces-redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-desifaces}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-desifaces_clients}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DF_ASSISTANT_LLM_MODEL: ${DF_ASSISTANT_LLM_MODEL:-${DF_DIRECTOR_LLM_MODEL:-}}
      DF_ASSISTANT_EMBEDDING_MODEL: ${DF_ASSISTANT_EMBEDDING_MODEL:-}
      DF_ASSISTANT_DISPLAY_NAME: ${DF_ASSISTANT_DISPLAY_NAME:-Piku}
      DF_ASSISTANT_SESSION_TTL_SECONDS: ${DF_ASSISTANT_SESSION_TTL_SECONDS:-86400}
      DF_ASSISTANT_MAX_HISTORY_MESSAGES: ${DF_ASSISTANT_MAX_HISTORY_MESSAGES:-12}
      DF_ASSISTANT_RAG_TOP_K: ${DF_ASSISTANT_RAG_TOP_K:-5}
      DF_DIRECTOR_BASE_URL: http://svc-director:8011
      DF_DASHBOARD_BASE_URL: http://svc-dashboard:8005
      DF_PRICING_BASE_URL: http://svc-pricing:8009
    depends_on:
      - desifaces-db
      - desifaces-redis
      - svc-director
      - svc-dashboard
    networks:
      - df-net
    ports:
      - "127.0.0.1:18012:8012"
